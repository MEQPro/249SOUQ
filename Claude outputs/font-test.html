<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Tajawal',sans-serif;background:#FAF6EE;padding:40px;color:#1A1208}
  .row{margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #e0d8c0}
  .label{font-size:13px;color:#888;margin-bottom:6px;font-family:sans-serif}
  h1{font-size:clamp(1.5rem,3.5vw,2.2rem);margin:0;line-height:1.3}
  .w400{font-weight:400}
  .w500{font-weight:500}
  .w600{font-weight:600}
  .w700{font-weight:700}
  .badge{font-size:13px;font-weight:600;color:#046A38;background:rgba(4,106,56,0.08);border:1px solid rgba(4,106,56,0.25);padding:3px 10px;border-radius:20px;vertical-align:middle}
</style>
</head>
<body>
  <div class="row">
    <div class="label">Weight 400 (Regular)</div>
    <h1 class="w400">بخور عبق الصندل <span class="badge">100 غم</span></h1>
  </div>
  <div class="row">
    <div class="label">Weight 500 (Medium)</div>
    <h1 class="w500">بخور عبق الصندل <span class="badge">100 غم</span></h1>
  </div>
  <div class="row">
    <div class="label">Weight 600 (current, on site now)</div>
    <h1 class="w600">بخور عبق الصندل <span class="badge">100 غم</span></h1>
  </div>
  <div class="row">
    <div class="label">Weight 700 (Bold)</div>
    <h1 class="w700">بخور عبق الصندل <span class="badge">100 غم</span></h1>
  </div>
</body>
</html>
